name: loam
description: Scan AI agent and MCP toolchains for risky dependency paths.

inputs:
  path:
    description: Directory to scan.
    required: false
    default: "."
  fail-on:
    description: Minimum severity that should fail the workflow. One of low, medium, high, critical, or none.
    required: false
    default: "critical"
  json:
    description: Print JSON instead of the terminal report.
    required: false
    default: "false"
  comment:
    description: Create or update a Loam comment on pull requests.
    required: false
    default: "true"
  diff:
    description: Compare the current ABOM against the baseline ABOM when the baseline file exists.
    required: false
    default: "true"
  baseline-path:
    description: Baseline ABOM path used for PR diffs.
    required: false
    default: ".loam/baseline-abom.json"
  policy-path:
    description: JSON policy path used for scan enforcement when the file exists.
    required: false
    default: ".loam/policy.json"
  github-token:
    description: GitHub token used to create or update pull request comments.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run loam
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        REPORT_PATH="$RUNNER_TEMP/loam-report.md"
        ABOM_PATH="$RUNNER_TEMP/loam-abom.json"
        DIFF_REPORT_PATH="$RUNNER_TEMP/loam-diff.md"
        COMMENT_PATH="$RUNNER_TEMP/loam-comment.md"
        ARGS=("scan" "${{ inputs.path }}" "--markdown" "$REPORT_PATH" "--abom" "$ABOM_PATH")

        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS+=("--json")
        fi

        if [ "${{ inputs.fail-on }}" != "none" ]; then
          ARGS+=("--fail-on" "${{ inputs.fail-on }}")
        fi

        if [ -f "${{ inputs.policy-path }}" ]; then
          ARGS+=("--policy" "${{ inputs.policy-path }}")
          ARGS+=("--approval-suggestions")
        fi

        set +e
        node "$GITHUB_ACTION_PATH/src/cli.mjs" "${ARGS[@]}"
        SCAN_STATUS=$?
        set -e

        cp "$REPORT_PATH" "$COMMENT_PATH"

        DIFF_STATUS=0
        if [ "${{ inputs.diff }}" = "true" ] && [ -f "${{ inputs.baseline-path }}" ]; then
          DIFF_ARGS=("diff" "--baseline" "${{ inputs.baseline-path }}" "--current" "$ABOM_PATH" "--markdown" "$DIFF_REPORT_PATH")

          if [ "${{ inputs.json }}" = "true" ]; then
            DIFF_ARGS+=("--json")
          fi

          if [ "${{ inputs.fail-on }}" != "none" ]; then
            DIFF_ARGS+=("--fail-on" "${{ inputs.fail-on }}")
          fi

          set +e
          node "$GITHUB_ACTION_PATH/src/cli.mjs" "${DIFF_ARGS[@]}"
          DIFF_STATUS=$?
          set -e

          cp "$DIFF_REPORT_PATH" "$COMMENT_PATH"
          {
            printf "\n---\n\n"
            printf "<details>\n"
            printf "<summary>Full Loam scan report</summary>\n\n"
            cat "$REPORT_PATH"
            printf "\n</details>\n"
          } >> "$COMMENT_PATH"
        elif [ "${{ inputs.diff }}" = "true" ]; then
          {
            printf "\n---\n\n"
            printf "# Loam Authority Change\n\n"
            printf "No baseline ABOM found at \`%s\`. Generate one with:\n\n" "${{ inputs.baseline-path }}"
            printf "\`\`\`bash\n"
            printf "mkdir -p .loam\n"
            printf "node ./src/cli.mjs scan . --abom .loam/baseline-abom.json\n"
            printf "\`\`\`\n"
          } >> "$COMMENT_PATH"
        fi

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          cat "$COMMENT_PATH" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "${{ inputs.comment }}" = "true" ]; then
          node "$GITHUB_ACTION_PATH/src/github-comment.mjs" "$COMMENT_PATH"
        fi

        if [ "$SCAN_STATUS" -ne 0 ]; then
          exit "$SCAN_STATUS"
        fi

        exit "$DIFF_STATUS"
