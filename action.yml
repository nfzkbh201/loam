name: agentsec
description: Scan AI agent and MCP toolchains for risky dependency paths.

inputs:
  path:
    description: Directory to scan.
    required: false
    default: "."
  fail-on:
    description: Minimum severity that should fail the workflow. One of low, medium, high, critical, or none.
    required: false
    default: "critical"
  json:
    description: Print JSON instead of the terminal report.
    required: false
    default: "false"
  comment:
    description: Create or update an AgentSec comment on pull requests.
    required: false
    default: "true"
  github-token:
    description: GitHub token used to create or update pull request comments.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run agentsec
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        REPORT_PATH="$RUNNER_TEMP/agentsec-report.md"
        ARGS=("scan" "${{ inputs.path }}" "--markdown" "$REPORT_PATH")

        if [ "${{ inputs.json }}" = "true" ]; then
          ARGS+=("--json")
        fi

        if [ "${{ inputs.fail-on }}" != "none" ]; then
          ARGS+=("--fail-on" "${{ inputs.fail-on }}")
        fi

        set +e
        node "$GITHUB_ACTION_PATH/src/cli.mjs" "${ARGS[@]}"
        SCAN_STATUS=$?
        set -e

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [ "${{ inputs.comment }}" = "true" ]; then
          node "$GITHUB_ACTION_PATH/src/github-comment.mjs" "$REPORT_PATH"
        fi

        exit "$SCAN_STATUS"
