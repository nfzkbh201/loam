name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: node --test

      - name: Smoke test CLI
        run: |
          node ./src/cli.mjs discover .
          node ./src/cli.mjs scan ./fixtures/browser-shell-risk --json > /tmp/loam-scan.json
          node ./src/cli.mjs scan ./fixtures/safe-agent --abom /tmp/loam-baseline-abom.json
          node ./src/cli.mjs scan ./fixtures/browser-shell-risk --markdown /tmp/loam-report.md --abom /tmp/loam-current-abom.json --research /tmp/loam-research.json
          node ./src/cli.mjs diff --baseline /tmp/loam-baseline-abom.json --current /tmp/loam-current-abom.json --markdown /tmp/loam-diff.md
          node ./src/cli.mjs scan ./fixtures/browser-shell-risk --policy examples/policy.json --markdown /tmp/loam-policy-report.md || test "$?" -eq 1
          node ./src/cli.mjs init-policy --policy /tmp/loam-policy.json
          node ./src/cli.mjs approve capability shell_exec --policy /tmp/loam-policy.json --reason "CI fixture" --approved-by ci --expires 2099-12-31
          node ./src/cli.mjs list-approvals --policy /tmp/loam-policy.json --json > /tmp/loam-approvals.json
          node ./src/cli.mjs suggest-approvals ./fixtures/browser-shell-risk --policy examples/policy.json > /tmp/loam-approval-suggestions.txt

      - name: Verify package
        run: npm pack --dry-run
