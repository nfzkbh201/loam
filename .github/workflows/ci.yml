name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: node --test

      - name: Smoke test CLI
        run: |
          node ./src/cli.mjs discover .
          node ./src/cli.mjs scan ./fixtures/browser-shell-risk --json > /tmp/agentsec-scan.json
          node ./src/cli.mjs scan ./fixtures/browser-shell-risk --markdown /tmp/agentsec-report.md --research /tmp/agentsec-research.json

      - name: Verify package
        run: npm pack --dry-run
